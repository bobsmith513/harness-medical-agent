# ============================================================================
# harness-medical-agent 可选基础设施：Milvus 向量库（M3）
#
# 启动： docker compose -f docker-compose.milvus.yaml up -d
# 停止： docker compose -f docker-compose.milvus.yaml down
#        （加 -v 连同数据卷一并清除）
#
# 启用： .env 中设置
#   HARNESS_RETRIEVAL__STORE=milvus
#   HARNESS_RETRIEVAL__MILVUS_URI=http://localhost:19530
#
# 说明：默认 store=local（内存向量 + 本地 BM25）零 Docker 即可全链路
# 跑通；本文件仅供生产/压测部署，语义与本地实现严格一致
# （patient_id partition key 分区隔离 + HNSW + COSINE）。
# ============================================================================

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: on-failure

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-05Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"  # 控制台（可选访问）
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: on-failure

  milvus:
    image: milvusdb/milvus:v2.4.15
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"  # gRPC（HARNESS_RETRIEVAL__MILVUS_URI 指向这里）
      - "9091:9091"  # 健康检查 / 指标
    depends_on:
      - etcd
      - minio
    restart: on-failure

volumes:
  etcd_data:
  minio_data:
  milvus_data:
