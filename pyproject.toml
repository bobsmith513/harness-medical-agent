[project]
name = "harness-agent"
version = "0.1.0"
description = "Harness Engineering 范式的医疗多智能体系统：纯编排主 Agent、fail-closed 路由、MCP 证据供给层、全量质量门禁。"
readme = "README.md"
license = "MIT"
authors = [{ name = "朱云鹏" }]
requires-python = ">=3.10"
keywords = ["llm", "multi-agent", "mcp", "rag", "medical-ai", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=1.2.11",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# dev：日常开发与 CI 所需
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
# bge：真实嵌入（BAAI/bge-large-zh）与精排（bge-reranker-v2-m3）
# torch 默认拉 CUDA 轮子；纯 CPU 环境可先执行
#   uv pip install torch --index-url https://download.pytorch.org/whl/cpu
bge = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
# milvus：向量存储切换 store=milvus（服务端用 docker-compose.milvus.yaml 启动）
milvus = [
    "pymilvus>=2.4",
]
# mcp：检索供给 MCP 封装（uv run harness-mcp-retrieval）
mcp = [
    "fastmcp>=2.3",
]
# llm：OpenAI 兼容端点客户端（vLLM 部署 / 在线 API；Mock 默认零依赖）
llm = [
    "httpx>=0.27",
]
# all：全部可插拔能力
all = [
    "harness-agent[bge,milvus,mcp,llm]",
]

[project.scripts]
# 在线问诊统一入口（整个项目的 main 函数）：uv run harness-online
harness-online = "harness_agent.main:main"
# 检索供给 MCP server（stdio 传输）：uv run harness-mcp-retrieval
harness-mcp-retrieval = "harness_agent.mcp.retrieval:main"

[project.urls]
Homepage = "https://github.com/bobsmith513/harness-medical-agent"
Issues = "https://github.com/bobsmith513/harness-medical-agent/issues"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_agent"]

# ---------------------------------------------------------------------------
# ruff：统一 lint 与 format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort（import 排序）
    "UP",  # pyupgrade（现代化语法）
    "B",   # flake8-bugbear（常见 bug 模式）
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["harness_agent"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/harness_agent"]
branch = true
